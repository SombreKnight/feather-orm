server:
  port: 9090

feather:
  orm:
    datasource:
      primary:
        url: jdbc:h2:mem:feather-sample;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
        username: sa
        password:


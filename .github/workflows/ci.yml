name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: [ '8', '17' ]
    services:
      # PostgreSQL 方言集成测试（PostgresDialectIntegrationTest）
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: feather_test
          POSTGRES_USER: feather
          POSTGRES_PASSWORD: feather
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U feather -d feather_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      # MySQL 方言集成测试（MySqlDialectIntegrationTest）
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: feather_test
          MYSQL_USER: feather
          MYSQL_PASSWORD: feather
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -ufeather -pfeather"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      PG_TEST_URL: jdbc:postgresql://localhost:5432/feather_test
      PG_TEST_USERNAME: feather
      PG_TEST_PASSWORD: feather
      MYSQL_TEST_URL: jdbc:mysql://localhost:3306/feather_test?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true
      MYSQL_TEST_USERNAME: feather
      MYSQL_TEST_PASSWORD: feather
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Build & test
        run: mvn -B test

name: Release to Maven Central

# 触发方式：推送 v* 格式的 tag，如 git tag v0.1.1 && git push origin v0.1.1
on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17 with GPG & Sonatype credentials
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          # 以下三个 Secret 需要在仓库 Settings → Secrets and variables → Actions 中配置：
          #   GPG_PRIVATE_KEY     签名私钥（armored 全文，含 -----BEGIN PGP PRIVATE KEY BLOCK-----）
          #   SONATYPE_USERNAME   central.sonatype.com 的 User Token username
          #   SONATYPE_PASSWORD   central.sonatype.com 的 User Token password
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          server-id: central
          server-username: ${{ secrets.SONATYPE_USERNAME }}
          server-password: ${{ secrets.SONATYPE_PASSWORD }}

      - name: Set project version from tag
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          echo "Releasing version: ${VERSION}"
          mvn -q versions:set -DnewVersion=${VERSION} -DgenerateBackupPoms=false

      - name: Build & test
        run: mvn -B test

      - name: Deploy to Maven Central (core + starter，samples 不发布)
        run: mvn -B clean deploy -pl '!feather-orm-samples'
